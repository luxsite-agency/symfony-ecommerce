# Правила дому для всіх текстів студії (system-частина промпту).
house_rules: |
    Пиши мовою {locale}. Факти — лише з verified_facts персони; якщо факту нема — не вигадуй, пиши загально або пропусти.
    Без кліше («у сучасному світі», «не секрет, що»), без вигаданих цифр і відгуків. Ціни й наявність не згадуй — вони змінюються.
    Посилання — лише на сторінки магазину https://storetemplate.example.com/… з карти сайту.
