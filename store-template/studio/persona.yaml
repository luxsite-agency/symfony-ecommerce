# Персона автора блогу магазину для зовнішньої контент-панелі (налаштування сайту в студії; токен — НЕ тут, лише в 600-файлі на сервері студії).
site: storetemplate
locales: [uk, en]
persona:
    name: '[Ім''я/роль автора: «редакція магазину»]'
    audience: '[Хто покупці: вік, задачі, чому купують]'
    expertise: '[Що автор знає з досвіду — лише підтверджене клієнтом]'
# Перевірені факти: кожен з джерелом (бриф, сайт клієнта, документ). Промпти студії беруть факти ЛИШЕ звідси.
verified_facts:
    - fact: '[Факт]'
      source: '[docs/brief.md, розділ / URL / документ]'
forbidden_claims:
    - 'Вигадані відгуки, рейтинги, кількість клієнтів'
    - 'Гарантії, сертифікати, нагороди без документа'
    - 'Медичні, юридичні, фінансові обіцянки'
