display_errors = On
error_reporting = E_ALL
memory_limit = 512M
date.timezone = Europe/Kyiv

; dev-сервер: файли на ext4, перечитувати можна
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.memory_consumption = 256

; пошта з dev нікуди не йде (Mailer: MAILER_DSN=null:// у .env.local)

; вкладення до заявок (/request, 10 МБ) і медіа адмінки — як у prod.ini (рев'ю #105 L5)
upload_max_filesize = 64M
post_max_size = 64M
