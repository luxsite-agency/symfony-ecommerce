; shop-engine prod: php-fpm під mem_limit контейнера ~512 МБ. ondemand — без простою воркерів на порожньому сайті.
[global]
error_log = /proc/self/fd/2

[www]
pm = ondemand
pm.max_children = 6
pm.process_idle_timeout = 30s
pm.max_requests = 1000
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null
