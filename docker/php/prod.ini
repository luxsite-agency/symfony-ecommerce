; shop-engine prod (Dockerfile.prod). Код незмінний у межах образу: новий реліз = новий контейнер, тож
; opcache файли не перевіряє, а класи ядра Symfony підвантажує preload (config/preload.php → var/cache/prod/*.preload.php).
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED
; аргументи викликів не зберігати у трейсах (як php.ini-production): у кадрі HttpClient::request() лежить auth_bearer
zend.exception_ignore_args = On
memory_limit = 256M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 60
date.timezone = Europe/Kyiv
realpath_cache_size = 4096K
realpath_cache_ttl = 600

opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.preload = /app/config/preload.php
opcache.preload_user = app
