# Магазин системи store-<key> (docker-compose.store.yml) за traefik або Caddy: TLS — на проксі, тут лише HTTP :80.
# Шаблон образу nginx (/etc/nginx/store-templates, NGINX_ENVSUBST_TEMPLATE_DIR): entrypoint підставляє ${STORE_X_ROBOTS_TAG}
# ${STORE_PHP_UPSTREAM} (php:9000 або php-next:9000 для кандидата релізу) і ${STORE_REAL_IP_HEADER} з env контейнера.
#   STORE_X_ROBOTS_TAG="noindex, nofollow" — технічний домен закритий від індексу (заголовок на все + robots.txt Disallow)
#   STORE_X_ROBOTS_TAG=""                  — сайт відкритий: заголовка нема, /robots.txt віддає Symfony/статика
# add_header з порожнім значенням nginx не надсилає; add_header у location перекриває серверні, тому повтор у кожному.

# Реальна IP клієнта (консиліум безпеки 10.10, доповнення): заголовок задає ${STORE_REAL_IP_HEADER} (tuning.env / store.env).
#   CF-Connecting-IP  — наш сервер за Cloudflare (proxy traefik): Cloudflare завжди перезаписує його, а firewall сервера
#                       пускає 80/443 лише з Cloudflare, тож X-Forwarded-For (який клієнт може підробити, а traefik лише
#                       дописує) не береться до уваги. Без цього всі ліміти (вхід, замовлення, реєстрація), Order.ip і
#                       security_audit рахувались на IP ребра Cloudflare, і один зловмисник блокував вхід усім.
#   X-Forwarded-For   — standalone (Caddy у стеку) чи без Cloudflare: real_ip_recursive пропускає довірені docker-мережі.
# Довіряємо лише docker-мережам (traefik або caddy). У Symfony REMOTE_ADDR лишається адресою проксі ($realip_remote_addr,
# trusted_proxies=private_ranges), а X-Forwarded-For/X-Real-IP переписуються на вже визначену nginx-ом адресу: спуфінг
# клієнтом неможливий у будь-якому режимі.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 192.168.0.0/16;
real_ip_header ${STORE_REAL_IP_HEADER};
real_ip_recursive on;

map $host $x_robots_tag { default "${STORE_X_ROBOTS_TAG}"; }
# Рев'ю #56, п. 1: access_log off у location /webhooks/ не діє, бо try_files робить внутрішній редирект у location index.php,
# і nginx пише лог за кінцевим location. Тому вимикаємо лог за $request_uri на рівні server (if=$loggable): токен вебхука
# CRM з query не потрапляє в stdout контейнера.
map $request_uri $loggable { default 1; ~^/webhooks/ 0; ~^/(api/admin|mcp)(/|\?|$) 0; }

# E15 PR-6: /api/admin і /mcp — ліміт з IP до PHP (10 запитів/с на адресу, сплеск 30) і журнал без вмісту: у access_log для цих
# шляхів лише метод, вид (mcp | api_admin) і статус — ні URI (SKU, query з пошуком), ні тіла; Authorization nginx не пише ніколи.
limit_req_zone $binary_remote_addr zone=shop_api:10m rate=10r/s;
log_format shop_api '$remote_addr [$time_local] $request_method $api_kind $status $body_bytes_sent $request_time';
map $request_uri $api_kind { default ""; ~^/mcp(/|\?|$) mcp; ~^/api/admin(/|\?|$) api_admin; }
# API/MCP живуть лише на хості адмінки — на інших хостах nginx віддає 404 сам (location нижче)
map $host $api_host_ok { default 0; "${STORE_ADMIN_HOST}" 1; }

server {
    listen 80;
    server_name _;
    root /app/public;
    server_tokens off;
    # вебхуки CRM (токен у query) не логуються, див. map $loggable вище
    access_log /var/log/nginx/access.log main if=$loggable;
    access_log /var/log/nginx/access.log shop_api if=$api_kind;

    client_max_body_size 64m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/xml application/javascript application/json image/svg+xml application/rss+xml font/ttf application/vnd.ms-fontobject;

    add_header X-Robots-Tag $x_robots_tag always;
    add_header X-Content-Type-Options nosniff always;

    location = /robots.txt {
        add_header X-Robots-Tag $x_robots_tag always;
        default_type text/plain;
        if ($x_robots_tag) {
            return 200 "User-agent: *\nDisallow: /\n";
        }
        try_files $uri /index.php$is_args$args;
    }

    # Статика з assets:install і public/assets — у образі, незмінна в межах релізу
    location ~ ^/(bundles|assets)/ {
        add_header X-Robots-Tag $x_robots_tag always;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        try_files $uri =404;
    }

    # Завантажені файли (Vich) і кеш Liip — том; чого нема (/media/cache/resolve/…) — у Symfony.
    # Консиліум безпеки 10.10, п. 7 (рев'ю #56, п. 4): allow-list типів. Лише jpeg/png/webp/gif/avif віддаються як зображення;
    # все інше (svg, svgz, pdf, html, shtml, js, xml, без розширення) — application/octet-stream лише як завантаження у CSP
    # sandbox, без sniffing. add_header у location перекриває серверний, тому nosniff і X-Robots-Tag продубльовано.
    location ^~ /media/ {
        add_header X-Robots-Tag $x_robots_tag always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "sandbox; default-src 'none'" always;
        add_header Content-Disposition "attachment" always;
        types { } default_type application/octet-stream;
        access_log off;
        location ~ \.php$ { return 404; }
        location ~* \.(jpe?g|png|webp|gif|avif)$ {
            add_header X-Robots-Tag $x_robots_tag always;
            add_header X-Content-Type-Options nosniff always;
            add_header Cache-Control "public, max-age=2592000";
            types { image/jpeg jpg jpeg; image/png png; image/webp webp; image/gif gif; image/avif avif; }
            try_files $uri /index.php$is_args$args;
        }
        try_files $uri /index.php$is_args$args;
    }

    location = /favicon.ico {
        add_header X-Robots-Tag $x_robots_tag always;
        access_log off;
        log_not_found off;
        try_files $uri =204;
    }

    # E15 PR-6: REST /api/admin і MCP /mcp — лише на хості адмінки (інший хост → 404 ще тут), тіло ≤ 1m (PHP — другий рубіж,
    # app.admin_api_max_body_bytes), ліміт з IP ДО PHP (зона shop_api: 10 запитів/с, сплеск 30, далі 429; на токен — у PHP).
    # limit_req_log_level info: у error_log не потрапляє рядок запиту з query; відмови видно в access_log (формат shop_api).
    location ~ ^/(api/admin|mcp)(/|$) {
        if ($api_host_ok = 0) { return 404; }
        client_max_body_size 1m;
        limit_req zone=shop_api burst=30 nodelay;
        limit_req_status 429;
        limit_req_log_level info;
        # відмови nginx — JSON у словнику API (RFC 6750), не HTML-сторінка
        error_page 413 @api_too_large;
        error_page 429 @api_too_many;
        try_files $uri /index.php$is_args$args;
    }
    location @api_too_large {
        default_type application/json;
        return 413 '{"error":"payload_too_large","error_description":"Тіло запиту понад 1 МБ"}';
    }
    location @api_too_many {
        default_type application/json;
        add_header Retry-After 1 always;
        return 429 '{"error":"too_many_requests","error_description":"Забагато запитів з цієї адреси, спробуйте за секунду"}';
    }

    # Заявка з вкладенням (POST /request, LeadRequestController): файл до 10 МБ + поля — 11m, 413 ще в nginx
    location = /request {
        client_max_body_size 11m;
        try_files $uri /index.php$is_args$args;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass ${STORE_PHP_UPSTREAM};
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param DOCUMENT_ROOT /app/public;
        fastcgi_param REMOTE_ADDR $realip_remote_addr;
        fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
        fastcgi_param HTTP_X_REAL_IP $remote_addr;
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        internal;
    }

    # Будь-який інший .php (у т.ч. завантажений) — 404, виконується лише index.php
    # Twig у public/ (помилково скопійована тема паку) ніколи не віддається сирцем — шаблони живуть у templates/store/ (E14)
    location ~ \.twig$ {
        return 404;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\. {
        return 404;
    }
}
