        customer_intro: 'Hello {name}! Thank you for your order. Our manager will contact you to confirm.'
        customer_outro: Kind regards, the shop team.
    account:
        hello: 'Hello, {name}!'
        hello_plain: Hello!
        verify:
            subject: 'Confirm your email at {site}'
            text: 'To finish signing up at {site}, please confirm your address.'
            button: Confirm email
            outro: 'The link is valid for {hours} hours. If you did not sign up, just ignore this email.'
        account_exists:
            subject: 'You already have an account at {site}'
            text: 'Someone tried to sign up at {site} with your address, but an account already exists. If it was you and you forgot your password, set a new one.'
            button: Set a new password
            outro: 'The link is valid for {minutes} min. If it was not you, do nothing: your password has not changed.'
        reset:
            subject: 'Password reset at {site}'
            text: 'You asked for a new password at {site}.'
            button: Set a new password
            outro: 'The link is valid for {minutes} min. If you did not ask for it, ignore this email.'
        login_link:
            subject: 'Log in to {site}'
            text: 'Your link to log in to {site} without a password.'
            button: Log in
            outro: 'The link works once and is valid for {minutes} min. If you did not ask for it, ignore this email.'
        password_changed:
            subject: 'Your password at {site} was changed'
            text: 'The password of your account at {site} has just been changed. Other devices have been logged out.'
            button: Restore access
            outro: 'If it was not you, restore access right away using the link above.'
            google: 'The Google account {email} is connected to your account and can still be used to sign in. If it is not yours, disconnect it in your profile.'
        email_change:
            subject: 'Confirm your new address on {site}'
            text: 'You asked to change your {site} account address to this one. Confirm it to make it active.'
            button: Confirm new address
            outro: 'The link is valid for {hours} hours. If you did not ask, ignore this email: the address will not change.'
        email_changed:
            subject: 'Your {site} account address was changed'
            text: 'The address of your {site} account was just changed to another one. Emails now go there. If this was you, no action is needed.'
            button: Restore old address and lock sign-in
            outro: 'If this was not you, press the button above within {hours} hours: the address comes back, the password is erased, all devices are signed out, and you set a new password via "Forgot password" on this address.'
        google_linked:
            subject: 'Google connected to your account at {site}'
            text: 'The Google account {email} has just been connected to your account at {site}: it can now be used to sign in.'
            button: Open profile
            outro: 'If it was not you, disconnect Google in your profile and change your password. If you have no password, set one via “Forgot password” to your own address.'
        google_unlinked:
            subject: 'Google disconnected from your account at {site}'
            text: 'The Google account {email} has just been disconnected from your account at {site}. Signing in with it no longer works.'
            button: Open profile
            outro: 'If it was not you, change your password: someone has access to your account.'
        export:
            subject: 'Your data from {site} is ready'
            text: 'The file with your {site} data is ready.'
            button: Download file
            outro: 'The link is one-time and valid for {hours} hours; it opens after signing in to your account.'
        deleted:
            subject: 'Your {site} account was deleted'
            text: 'Your {site} account was deleted at your request: sign-in is closed and sign-in data erased.'
            button: Go to the site
            outro: 'If this was not you, reply to this email.'
        wholesale_approved:
            subject: 'Wholesale application at {site} approved'
            text: 'Your application at {site} has been approved: wholesale prices are now active for your account.'
            reason: 'Manager comment:'
            button: Go to your account
            outro: 'If you have any questions, reply to this email.'
        wholesale_rejected:
            subject: 'Wholesale application at {site} declined'
            text: 'Unfortunately, your application at {site} has been declined.'
            reason: 'Reason:'
            button: Submit a new application
            outro: 'If you think this is a mistake, reply to this email.'
