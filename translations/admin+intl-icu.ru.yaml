setting:
  key:
    analytics:
      gtm_container_id:
        label: Идентификатор контейнера Google Tag Manager
        help: GTM-XXXXXXX. Если задан, GA4 и Pixel лучше подключать внутри GTM.
      ga4_measurement_id:
        label: Идентификатор потока Google Analytics 4
        help: G-XXXXXXXXXX. Выводится gtag.js, только когда GTM не задан.
      fb_pixel_id:
        label: Идентификатор пикселя Meta (Facebook)
        help: Числовой id пикселя Meta. Движок отправляет PageView и ecommerce-события (ViewContent, AddToCart, InitiateCheckout, Purchase; content_ids = SKU варианта, как в фиде) только при согласии на cookie. Если пиксель настроен в GTM — оставьте пустым, иначе события задвоятся (docs/analytics.md).
      tags_on_dev:
        label: Включать теги на dev
        help: На prod теги и HTML-коды выводятся всегда; на dev/test — только с этим переключателем (по умолчанию выключен, чтобы тестовые просмотры не попадали в аналитику).
      consent_granted_locales:
        label: 'Согласие на cookie: языки, где оно действует сразу'
        help: Через запятую. Для этих языков consent = granted без баннера; для остальных — denied и баннер согласия (EU).
    seo:
      google_site_verification:
        label: Google Search Console — код верификации
        help: Значение meta google-site-verification (без тега).
      bing_site_verification:
        label: Bing Webmaster — код верификации
        help: Значение meta msvalidate.01 (без тега).
    html:
      head:
        label: Свой код в заголовке страницы
        help: Произвольный HTML/JS, выводится как есть в <head> каждой страницы сайта. Только для администратора.
      body_start:
        label: Свой код в начале страницы
        help: Выводится как есть сразу после <body>.
      body_end:
        label: Свой код в конце страницы
        help: Выводится как есть перед </body>.
    orders:
      notify_email:
        label: Почта для новых заказов
        help: Куда отправлять письмо о каждом новом заказе; несколько адресов через запятую. Пусто — не отправлять.
    prices:
      notify_email:
        label: Почта для применённых ценовых пакетов
        help: Кому отправлять сводку, когда применён пакет изменений с ценами (AI, CLI). Несколько адресов через запятую. Пусто — всем активным пользователям с ролью менеджера (без администраторов).
    catalog:
      facet_counts_enabled:
        label: Показывать счётчики в фильтрах
        help: 'Количество товаров рядом со значениями фильтров категории. Выключено — значения показываются без цифр (ADR Rev 11). На больших каталогах счётчики дорогие: см. порог ниже.'
      facet_counts_max_set:
        label: Порог счётчиков фильтров, карточек
        help: Если в отфильтрованном наборе больше карточек, счётчики не считаются и не выводятся (значения остаются, без цифры). Целое число; пусто — 20000.
    feeds:
      default_brand:
        label: Бренд для товаров без бренда (фид Meta)
        help: 'Meta отклоняет товар без бренда: для карточек без бренда в фид Meta идёт это значение, пусто — название магазина. Google-фид его не использует (там товар без бренда помечается identifier_exists = no).'
    ai:
      openrouter_key:
        label: Ключ OpenRouter
        help: Ключ API с openrouter.ai/keys (sk-or-v1-…). AI-функции админки работают на этом ключе и за счёт его кредитов. Хранится зашифрованным, показывается только маской; пустое поле при сохранении — оставить текущий ключ. Без ключа AI-кнопок в админке нет (docs/ai.md).
      model:
        label: Модель AI
        help: Строка vendor/model с openrouter.ai/models, напр. deepseek/deepseek-v4-pro или anthropic/claude-sonnet-4.5. Пусто — модель движка по умолчанию.
      monthly_budget_usd:
        label: Месячный лимит расходов AI, $
        help: Когда сумма расходов за календарный месяц (по данным OpenRouter) достигает лимита, AI-функции до конца месяца не вызываются. 0 или пусто — без лимита.
    google:
      sign_in_enabled:
        label: "Включено"
        help: "Кнопка «Продолжить с Google» на входе, регистрации и в окне отзыва. Работает только вместе с Client ID и Client Secret ниже; инструкция и адреса для Google Cloud Console — под списком настроек."
      client_id:
        label: "Client ID"
        help: "Из Google Cloud Console → Credentials → OAuth client ID (Web application): строка вида 123456789012-abc…xyz.apps.googleusercontent.com."
      client_secret:
        label: "Client Secret"
        help: "Оттуда же (GOCSPX-…). Хранится шифрованно, показывается только маской; пустое поле при сохранении — оставить текущий. Ротация: в Cloud Console создайте новый secret в том же клиенте, вставьте сюда, затем отключите старый."
    site:
      platform_credit:
        label: "Строка платформы в футере"
        help: "«Полный» — платформа, открытый код под лицензией Apache 2.0, разработчики LuxSite и ссылка «Лицензия»; «Кратко» — «Ecommerce LuxSite»; «Не показывать» — строки нет. По Apache 2.0 показ на сайте не обязателен: требование NOTICE касается только распространения кода. Страница /license остаётся доступной по адресу (закрыта от индексации)."
