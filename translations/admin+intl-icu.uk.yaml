setting:
  key:
    analytics:
      gtm_container_id:
        label: Ідентифікатор контейнера Google Tag Manager
        help: GTM-XXXXXXX. Якщо задано, GA4 і Pixel краще підключати всередині GTM.
      ga4_measurement_id:
        label: Ідентифікатор потоку Google Analytics 4
        help: G-XXXXXXXXXX. Виводиться gtag.js лише коли GTM не задано.
      fb_pixel_id:
        label: Ідентифікатор пікселя Meta (Facebook)
        help: Числовий id пікселя Meta. Рушій шле PageView і ecommerce-події (ViewContent, AddToCart, InitiateCheckout, Purchase; content_ids = SKU варіанта, як у фіді) лише за згоди на cookie. Якщо піксель налаштовано в GTM — залиште порожнім, інакше події задвояться (docs/analytics.md).
      tags_on_dev:
        label: Вмикати теги на dev
        help: На prod теги й HTML-коди виводяться завжди; на dev/test — лише з цим перемикачем (типово вимкнено, щоб тестові перегляди не потрапляли в аналітику).
      consent_granted_locales:
        label: 'Згода на cookie: мови, де вона діє одразу'
        help: Через кому. Для цих мов consent = granted без банера; для решти — denied і банер згоди (EU).
    seo:
      google_site_verification:
        label: Google Search Console — код верифікації
        help: Значення meta google-site-verification (без тегу).
      bing_site_verification:
        label: Bing Webmaster — код верифікації
        help: Значення meta msvalidate.01 (без тегу).
    html:
      head:
        label: Свій код у заголовку сторінки
        help: Довільний HTML/JS, виводиться сирим у <head> кожної сторінки сайту. Лише для адміністратора.
      body_start:
        label: Свій код на початку сторінки
        help: Виводиться сирим одразу після <body>.
      body_end:
        label: Свій код у кінці сторінки
        help: Виводиться сирим перед </body>.
    orders:
      notify_email:
        label: Пошта для нових замовлень
        help: Куди надсилати лист про кожне нове замовлення; кілька адрес через кому. Порожньо — не надсилати.
    prices:
      notify_email:
        label: Пошта для застосованих цінових пакетів
        help: Кому надсилати зведення, коли застосовано пакет змін із цінами (AI, CLI). Кілька адрес через кому. Порожньо — усім активним користувачам з роллю менеджера (без адміністраторів).
    catalog:
      facet_counts_enabled:
        label: Показувати лічильники у фільтрах
        help: 'Кількість товарів біля значень фільтрів категорії. Вимкнено — значення показуються без цифр (ADR Rev 11). На великих каталогах лічильники дорогі: див. поріг нижче.'
      facet_counts_max_set:
        label: Поріг лічильників фільтрів, карток
        help: Якщо у відфільтрованому наборі більше карток, лічильники не рахуються і не виводяться (значення лишаються, без цифри). Ціле число; порожньо — 20000.
    feeds:
      default_brand:
        label: Бренд для товарів без бренду (фід Meta)
        help: 'Meta відхиляє товар без бренду: для карток без бренду у фід Meta йде це значення, порожньо — назва магазину. Google-фід його не бере (там товар без бренду позначається identifier_exists = no).'
    ai:
      openrouter_key:
        label: Ключ OpenRouter
        help: Ключ API з openrouter.ai/keys (sk-or-v1-…). AI-функції адмінки працюють на цьому ключі й за рахунок його кредитів. Зберігається шифровано, показується лише маскою; порожнє поле при збереженні — лишити чинний ключ. Без ключа AI-кнопок в адмінці нема (docs/ai.md).
      model:
        label: Модель AI
        help: Рядок vendor/model з openrouter.ai/models, напр. deepseek/deepseek-v4-pro або anthropic/claude-sonnet-4.5. Порожньо — модель за замовчуванням рушія.
      monthly_budget_usd:
        label: Місячний ліміт витрат AI, $
        help: Коли сума витрат за календарний місяць (за даними OpenRouter) досягає ліміту, AI-функції до кінця місяця не викликаються. 0 або порожньо — без ліміту.
    google:
      sign_in_enabled:
        label: "Увімкнено"
        help: "Кнопка «Продовжити з Google» на вході, реєстрації та у вікні відгуку. Працює лише разом із Client ID і Client Secret нижче; інструкція й адреси для Google Cloud Console — під списком налаштувань."
      client_id:
        label: "Client ID"
        help: "З Google Cloud Console → Credentials → OAuth client ID (Web application): рядок виду 123456789012-abc…xyz.apps.googleusercontent.com."
      client_secret:
        label: "Client Secret"
        help: "Звідти ж (GOCSPX-…). Зберігається шифровано, показується лише маскою; порожнє поле при збереженні — лишити чинний. Ротація: у Cloud Console створіть новий secret у тому ж клієнті, вставте сюди, потім вимкніть старий."
    site:
      platform_credit:
        label: "Рядок платформи у футері"
        help: "«Повний» — платформа, відкритий код під ліцензією Apache 2.0, розробники LuxSite і посилання «Ліцензія»; «Коротко» — «Ecommerce LuxSite»; «Не показувати» — рядка нема. Під Apache 2.0 показ на сайті не обов'язковий: вимога NOTICE стосується лише поширення коду. Сторінка /license лишається доступною за адресою (закрита від індексації)."
