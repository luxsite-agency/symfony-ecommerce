setting:
  key:
    analytics:
      gtm_container_id:
        label: Google Tag Manager container ID
        help: GTM-XXXXXXX. If set, add GA4 and the Pixel inside GTM instead.
      ga4_measurement_id:
        label: Google Analytics 4 measurement ID
        help: G-XXXXXXXXXX. Output via gtag.js only when GTM isn't set.
      fb_pixel_id:
        label: Meta (Facebook) Pixel ID
        help: Numeric Meta Pixel ID. The engine sends PageView and ecommerce events (ViewContent, AddToCart, InitiateCheckout, Purchase; content_ids = variant SKU, as in the feed) only with cookie consent. If the Pixel is set up in GTM, leave this empty, otherwise events are sent twice (docs/analytics.md).
      tags_on_dev:
        label: Enable tags on dev
        help: On prod, tags and HTML code are always output; on dev/test only with this switch (off by default so test visits don't reach analytics).
      consent_granted_locales:
        label: 'Cookie consent: languages where it is granted by default'
        help: Comma-separated. For these languages consent = granted with no banner; for the rest it is denied and a consent banner is shown (EU).
    seo:
      google_site_verification:
        label: Google Search Console verification code
        help: The google-site-verification meta value (without the tag).
      bing_site_verification:
        label: Bing Webmaster verification code
        help: The msvalidate.01 meta value (without the tag).
    html:
      head:
        label: Custom code in page head
        help: Any HTML/JS, output raw in the <head> of every site page. Administrators only.
      body_start:
        label: Custom code at page start
        help: Output raw right after <body>.
      body_end:
        label: Custom code at page end
        help: Output raw before </body>.
    orders:
      notify_email:
        label: Email for new orders
        help: Where to send an email about each new order; separate multiple addresses with commas. Leave empty to send nothing.
    prices:
      notify_email:
        label: Email for applied price change sets
        help: Who gets a summary when a change set with prices is applied (AI, CLI). Separate multiple addresses with commas. Leave empty to notify all active users with the Manager role (not administrators).
    catalog:
      facet_counts_enabled:
        label: Show counts in filters
        help: 'Number of products next to category filter values. When off, values show without numbers (ADR Rev 11). Counts are expensive on large catalogs: see the threshold below.'
      facet_counts_max_set:
        label: Filter count threshold, products
        help: If the filtered set has more products than this, counts aren't calculated or shown (values stay, without numbers). Whole number; leave empty for 20000.
    feeds:
      default_brand:
        label: Brand for products without a brand (Meta feed)
        help: 'Meta rejects products without a brand: products with no brand get this value in the Meta feed; leave empty to use the store name. The Google feed doesn''t use it (there, a product without a brand is marked identifier_exists = no).'
    ai:
      openrouter_key:
        label: OpenRouter key
        help: API key from openrouter.ai/keys (sk-or-v1-…). Admin AI features run on this key and its credits. Stored encrypted and shown only masked; leave the field empty when saving to keep the current key. Without a key there are no AI buttons in the admin (docs/ai.md).
      model:
        label: AI model
        help: A vendor/model string from openrouter.ai/models, e.g. deepseek/deepseek-v4-pro or anthropic/claude-sonnet-4.5. Leave empty for the engine default.
      monthly_budget_usd:
        label: Monthly AI spending limit, $
        help: Once spending for the calendar month (per OpenRouter) reaches the limit, AI features stop until the end of the month. 0 or empty means no limit.
    google:
      sign_in_enabled:
        label: "Enabled"
        help: "Shows the “Continue with Google” button on sign-in, registration and in the review form. Works only together with the Client ID and Client Secret below; setup steps and the addresses for Google Cloud Console are below the settings list."
      client_id:
        label: "Client ID"
        help: "From Google Cloud Console → Credentials → OAuth client ID (Web application): a string like 123456789012-abc…xyz.apps.googleusercontent.com."
      client_secret:
        label: "Client Secret"
        help: "From the same place (GOCSPX-…). Stored encrypted and only ever shown masked; leave the field empty when saving to keep the current one. To rotate it, create a new secret in the same client in Cloud Console, paste it here, then disable the old one."
    site:
      platform_credit:
        label: "Platform credit in the footer"
        help: "“Full” — the platform, open source under the Apache 2.0 licence, developed by LuxSite, with a “Licence” link; “Short” — “Ecommerce LuxSite”; “Don’t show” — no line at all. Apache 2.0 doesn’t require showing it on the site: the NOTICE requirement only applies to distributing the code. The /license page stays available at its address (hidden from search engines)."
