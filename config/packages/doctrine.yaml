doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        # Одна СУБД для тестів і проду (ADR D12): MySQL 8.0 — стоїть на старому прод-сервері.
        server_version: '8.0'
        charset: utf8mb4
        default_table_options:
            charset: utf8mb4
            collate: utf8mb4_0900_ai_ci
        profiling_collect_backtrace: '%kernel.debug%'
        # Таблиці без сутностей (staging імпорту, read-index фільтрів catalog_filter_* за ADR Rev 9) створюють міграції, схему не валідують
        # + messenger_messages: створює міграція, транспорт у тестах in-memory
        # + sessions (PdoSessionHandler): створює міграція; у тестах сховище сесій mock, схему таблиці Doctrine там не знає
        schema_filter: '~^(?!catalog_import_staging$|messenger_messages$|sessions$|catalog_product_rating$|catalog_filter_)~'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        auto_mapping: true
        mappings:
            # Ядро шаблону: мерджиться з template у магазини клієнтів (ADR D1)
            Core:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Core'
                prefix: 'App\Core'
                alias: Core
            # Клієнтське: сутності конкретного магазину
            Store:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Store'
                prefix: 'App\Store'
                alias: Store

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
