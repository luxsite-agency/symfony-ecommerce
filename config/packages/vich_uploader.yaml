vich_uploader:
    db_driver: orm
    metadata:
        type: attribute

    mappings:
        # Медіатека каталогу (Core/Catalog/Entity/Media): файл лежить у public/media/<унікальне-ім'я>, шлях — Media.path.
        catalog_media:
            uri_prefix: /media
            upload_destination: '%kernel.project_dir%/public/media'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
            inject_on_load: false
            delete_on_update: false
            delete_on_remove: true
